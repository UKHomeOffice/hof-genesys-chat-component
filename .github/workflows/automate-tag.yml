  #   permissions:
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: sonar-coverage
  #         path: coverage
  #     - name: Check Sonar configuration
  #       env:
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #       run: |
  #         test -n "$SONAR_HOST_URL" || { echo "::error::Missing SONAR_HOST_URL secret"; exit 1; }
  #         test -n "$SONAR_TOKEN" || { echo "::error::Missing SONAR_TOKEN secret"; exit 1; }
  #     - name: Scan code and wait for the quality gate
  #       uses: SonarSource/sonarqube-scan-action@v8.3.0
  #       env:
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #       with:
  #         args: -Dsonar.qualitygate.wait=true

  auto-tag-patch:
    needs: [test, trivy]
    runs-on: ubuntu-22.04
    if: |
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[MAJOR]') &&
      !contains(github.event.head_commit.message, '[MINOR]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - run: |
          git config --local user.email "$(git log --format='%ae' HEAD^!)"
          git config --local user.name "$(git log --format='%an' HEAD^!)"
          yarn version --patch --git-tag-version
      - run: yarn postversion:ci

  auto-tag-minor:
    needs: [test, trivy]
    runs-on: ubuntu-22.04
    if: |
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[MAJOR]') &&
      contains(github.event.head_commit.message, '[MINOR]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - run: |
          git config --local user.email "$(git log --format='%ae' HEAD^!)"
          git config --local user.name "$(git log --format='%an' HEAD^!)"
          yarn version --minor --git-tag-version
      - run: yarn postversion:ci

  auto-tag-major:
    needs: [test, trivy]
    runs-on: ubuntu-22.04
    if: |
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[MAJOR]') &&
      !contains(github.event.head_commit.message, '[MINOR]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - run: |
          git config --local user.email "$(git log --format='%ae' HEAD^!)"
          git config --local user.name "$(git log --format='%an' HEAD^!)"
          yarn version --major --git-tag-version
      - run: yarn postversion:ci

      