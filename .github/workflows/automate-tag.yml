# Lint, test and scan before tagging. Successful main runs trigger Automate_Publish.
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages
name: Automate_Tag
on: [push]
env:
  NODE_VERSION: 24
jobs:
  test:    
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: borales/actions-yarn@v4
        with:
          cmd: install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      # Restore with the Sonar job once server connectivity is resolved.
      # - name: Upload coverage for Sonar
      #   if: matrix.node-version == '24.x'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sonar-coverage
      #     path: coverage/lcov.info
      #     if-no-files-found: error

  trivy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependency vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          skip-dirs: node_modules,sandbox/node_modules,.git,coverage,dist

  # Temporarily disabled pending the team's Sonar connectivity ticket.
  # Restore this job, coverage upload and sonar in all tagging needs lists together.
